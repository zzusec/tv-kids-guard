name: Build community debug APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3.2.2
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Test Python tools (no production key required)
        run: python3 -I -B -m unittest discover -s tools -p 'test_*.py' -v

      - name: Test and build community debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      # Community debug signatures differ from the official signing key.
      # This APK cannot replace an official install or be used for official OTA.
      - name: Upload community debug APK (not an official OTA package)
        uses: actions/upload-artifact@v5
        with:
          name: tv-kids-guard-community-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
